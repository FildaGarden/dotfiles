# --- Global Settings ---
unbind C-b
set -g prefix C-a
bind -n C-a send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:Tc"
set -g status-position bottom
set -g status-interval 5

# --- Catppuccin v2.1.2 Config (Moduly pro pravou stranu) ---
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background "default"
set -g @catppuccin_status_modules_right "directory cpu battery date_time"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

# --- Initialize TPM ---
run '~/.tmux/plugins/tpm/tpm'

# --- RUČNÍ OVERRIDE (Oprava transparentnosti a kulatých rohů) ---
# Tento blok musí být až na konci, aby přebil nastavení pluginů

# 1. Globální transparentnost
set -g status-bg default
set -g status-style bg=default

# 2. Kulatá okna (Pilulky)
# Neaktivní okno
setw -g window-status-format "#[fg=#313244,bg=default]#[fg=#cdd6f4,bg=#313244] #I #W #[fg=#313244,bg=default]"

# Aktivní okno (Magenta/Fialová jako na tvém screenu)
setw -g window-status-current-format "#[fg=#cba6f7,bg=default]#[fg=#11111b,bg=#cba6f7,bold] #I #W #[fg=#cba6f7,bg=default]"

# 3. Tmux Sessionizer & Scratchpad (Oprava switch-client)
unbind '~'
bind-key -n C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Vytvoření scratchpadu pokud neexistuje a přepnutí
run-shell "tmux has-session -t scratch 2>/dev/null || tmux new-session -ds scratch -c ~"
bind-key '~' switch-client -t scratch
bind-key L switch-client -lind-key L switch-client -lind-key L switch-client -lind-key L switch-client -l
